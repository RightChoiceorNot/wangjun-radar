<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Threads 網軍偵防師</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a26;
    --border: #2a2a3a; --accent: #ff3b5c; --accent2: #ffb800;
    --accent3: #00e5a0; --text: #e8e8f0; --muted: #7070a0;
    --font-display: 'Syne', sans-serif; --font-mono: 'DM Mono', monospace;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font-display); min-height: 100vh; font-variant-numeric: lining-nums; }
  .app { min-height: 100vh; padding: 40px 20px 100px; position: relative; overflow: hidden; }
  .app::before { content: ''; position: fixed; top: -200px; right: -200px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(255,59,92,0.08) 0%, transparent 70%); pointer-events: none; z-index: 0; }
  .app::after { content: ''; position: fixed; bottom: -200px; left: -200px; width: 500px; height: 500px; background: radial-gradient(circle, rgba(0,229,160,0.06) 0%, transparent 70%); pointer-events: none; z-index: 0; }
  .container { max-width: 720px; margin: 0 auto; position: relative; z-index: 1; }

  .header { margin-bottom: 40px; }
  .header-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,59,92,0.12); border: 1px solid rgba(255,59,92,0.3); border-radius: 100px; padding: 6px 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: var(--accent); text-transform: uppercase; margin-bottom: 20px; }
  .badge-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: pulse 1.5s ease-in-out infinite; flex-shrink: 0; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.8);} }
  .header h1 { font-size: clamp(30px, 7vw, 52px); font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; font-variant-numeric: lining-nums; }
  .header h1 span { color: var(--accent); }
  .header p { margin-top: 12px; color: var(--muted); font-size: 13px; line-height: 1.7; font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; }

  .search-row { display: flex; margin-bottom: 32px; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); }
  .search-prefix { background: var(--surface); padding: 0 18px; color: var(--muted); font-family: var(--font-mono); font-size: 16px; display: flex; align-items: center; border-right: 1px solid var(--border); flex-shrink: 0; }
  #username-input { flex: 1; background: var(--surface); border: none; padding: 18px 16px; color: var(--text); font-family: var(--font-display); font-size: 16px; font-weight: 700; outline: none; min-width: 0; transition: background 0.2s; }
  #username-input::placeholder { color: var(--muted); font-weight: 400; }
  #username-input:focus { background: var(--surface2); }
  #username-input:disabled { opacity: 0.6; }
  #scan-btn { background: var(--accent); border: none; padding: 0 24px; color: #fff; font-family: var(--font-display); font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.2s; white-space: nowrap; letter-spacing: 0.04em; flex-shrink: 0; }
  #scan-btn:hover:not(:disabled) { background: #e0253e; }
  #scan-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .steps { display: flex; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 28px; }
  .step { flex: 1; padding: 10px 4px; text-align: center; font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); background: var(--surface); border-right: 1px solid var(--border); font-family: var(--font-mono); transition: all 0.3s; }
  .step:last-child { border-right: none; }
  .step-num { display: block; font-size: 14px; margin-bottom: 3px; }
  .step.active { color: var(--accent); background: rgba(255,59,92,0.08); }
  .step.done { color: var(--accent3); background: rgba(0,229,160,0.06); }

  .loading-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 40px 24px; text-align: center; margin-bottom: 24px; }
  .spinner { width: 48px; height: 48px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-title { color: var(--accent); font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .loading-sub { color: var(--muted); font-size: 12px; font-family: var(--font-mono); line-height: 1.6; }
  .progress-wrap { margin-top: 16px; }
  .progress-bar-bg { height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 99px; width: 0%; transition: width 0.5s ease; }
  .progress-label { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10px; font-family: var(--font-mono); color: var(--muted); }

  .error-box { background: rgba(255,59,92,0.08); border: 1px solid rgba(255,59,92,0.3); border-radius: 12px; padding: 18px 22px; color: var(--accent); font-family: var(--font-mono); font-size: 13px; line-height: 1.6; margin-bottom: 24px; word-break: break-all; }

  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; animation: fadeUp 0.4s ease; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);} }

  .profile-strip { display: flex; align-items: center; gap: 16px; padding: 20px 24px; border-bottom: 1px solid var(--border); background: var(--surface2); flex-wrap: wrap; }
  .avatar { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 24px; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .profile-info { flex: 1; min-width: 120px; }
  .profile-name { font-weight: 700; font-size: 16px; }
  .profile-handle { color: var(--muted); font-size: 13px; font-family: var(--font-mono); margin-top: 2px; }
  .profile-location { font-size: 11px; color: var(--accent2); font-family: var(--font-mono); margin-top: 4px; }
  .profile-location.foreign { color: var(--accent); }
  .profile-stats { display: flex; gap: 16px; flex-shrink: 0; flex-wrap: wrap; }
  .stat { text-align: center; }
  .stat-val { font-weight: 700; font-size: 15px; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
  .stat-key { font-size: 9px; color: var(--muted); letter-spacing: 0.04em; margin-top: 2px; line-height: 1.3; max-width: 72px; text-align: center; }

  .activity-bar-wrap { padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--surface2); }
  .activity-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
  .activity-bar-bg { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; display: flex; }
  .activity-bar-posts { height: 100%; background: var(--accent3); transition: width 1s cubic-bezier(0.4,0,0.2,1) 0.3s; }
  .activity-bar-comments { height: 100%; background: var(--accent2); transition: width 1s cubic-bezier(0.4,0,0.2,1) 0.3s; }
  .activity-legend { display: flex; gap: 16px; margin-top: 8px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; font-family: var(--font-mono); color: var(--muted); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .score-section { display: flex; align-items: center; gap: 28px; padding: 32px 24px 24px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .score-ring-wrap { position: relative; flex-shrink: 0; }
  .score-ring { width: 120px; height: 120px; transform: rotate(-90deg); }
  .score-ring-bg { fill: none; stroke: var(--border); stroke-width: 8; }
  .score-ring-fill { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(0.4,0,0.2,1); }
  .score-number { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .score-val { font-size: 32px; font-weight: 800; line-height: 1; }
  .score-max { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .score-verdict { flex: 1; min-width: 180px; }
  .verdict-tag { display: inline-block; padding: 6px 14px; border-radius: 100px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
  .verdict-safe { background: rgba(0,229,160,0.15); color: var(--accent3); }
  .verdict-suspicious { background: rgba(255,184,0,0.15); color: var(--accent2); }
  .verdict-high { background: rgba(255,100,0,0.15); color: #ff6400; }
  .verdict-confirmed { background: rgba(255,59,92,0.15); color: var(--accent); }
  .verdict-text { font-size: 13px; line-height: 1.7; color: var(--muted); font-family: var(--font-mono); }

  .dimensions { padding: 24px; border-bottom: 1px solid var(--border); }
  .section-title { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 18px; }
  .dim-item { margin-bottom: 18px; }
  .dim-item:last-child { margin-bottom: 0; }
  .dim-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
  .dim-name { font-size: 13px; font-weight: 700; }
  .dim-score-text { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
  .dim-bar-bg { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .dim-bar-fill { height: 100%; border-radius: 99px; width: 0; transition: width 1s cubic-bezier(0.4,0,0.2,1) 0.2s; }
  .dim-note { font-size: 11px; color: var(--muted); margin-top: 5px; font-family: var(--font-mono); line-height: 1.5; }

  .analysis-section { padding: 24px; border-bottom: 1px solid var(--border); }
  .analysis-title { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .ai-badge { background: var(--accent); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 9px; }
  .analysis-text { font-size: 13px; line-height: 1.9; color: var(--text); font-family: var(--font-mono); white-space: pre-wrap; }


  .cib-section { padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--surface2); }
  .cib-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .cib-label { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .cib-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 100px; font-family: var(--font-mono); }
  .cib-none { background: rgba(0,229,160,0.12); color: var(--accent3); }
  .cib-low { background: rgba(255,184,0,0.12); color: var(--accent2); }
  .cib-high { background: rgba(255,59,92,0.12); color: var(--accent); }
  .cib-detail { font-size: 11px; color: var(--muted); font-family: var(--font-mono); line-height: 1.7; }
  .hidden { display: none !important; }
  /* 全域：所有數字強制不斜線 0 */
  .score-val, .stat-val, .dim-score-text, .score-max {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif !important;
    font-variant-numeric: lining-nums !important;
  }
</style>
</head>
<body>
<div class="app">
  <div class="container">
    <div class="header">
      <div class="header-badge"><span class="badge-dot"></span>網軍偵防系統 v1.0</div>
      <h1>Threads<br /><span>網軍偵防師</span></h1>
      <p>輸入帳號名稱，系統將同時分析自發文與留言行為，透過 AI 給出網軍風險評分（滿分 100 分）。</p>
    </div>

    <div class="search-row">
      <div class="search-prefix">@</div>
      <input id="username-input" type="text" placeholder="輸入 Threads 帳號名稱" autocomplete="off" autocapitalize="off" />
      <button id="scan-btn">開始偵防</button>
    </div>

    <div class="steps hidden" id="steps">
      <div class="step" id="step-1"><span class="step-num">1</span>帳號</div>
      <div class="step" id="step-2"><span class="step-num">2</span>自發文</div>
      <div class="step" id="step-3"><span class="step-num">3</span>留言</div>
      <div class="step" id="step-4"><span class="step-num">4</span>AI分析</div>
      <div class="step" id="step-5"><span class="step-num">✓</span>完成</div>
    </div>

    <div class="loading-box hidden" id="loading-box">
      <div class="spinner"></div>
      <div class="loading-title" id="loading-title">正在處理…</div>
      <div class="loading-sub" id="loading-sub"></div>
      <div class="progress-wrap">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
        <div class="progress-label">
          <span id="progress-pct">0%</span>
          <span id="progress-time">預計約 90 秒</span>
        </div>
      </div>
    </div>

    <div class="error-box hidden" id="error-box"></div>

    <div class="result-card hidden" id="result-card">
      <div class="profile-strip">
        <div class="avatar" id="avatar-wrap">👤</div>
        <div class="profile-info">
          <div class="profile-name" id="profile-name">—</div>
          <div class="profile-handle" id="profile-handle">@—</div>
        </div>
        <div class="profile-stats">
          
<div class="stat"><div class="stat-val" id="stat-followers">—</div><div class="stat-key">粉絲</div></div>
          <div class="stat"><div class="stat-val" id="stat-own-posts">—</div><div class="stat-key" id="stat-own-posts-label">自發文</div></div>
          <div class="stat"><div class="stat-val" id="stat-comments">—</div><div class="stat-key" id="stat-comments-label">留言</div></div>
        </div>
      </div>

      <div class="activity-bar-wrap">
        <div class="activity-label">
          <span>活動類型分佈</span>
          <span id="activity-ratio-text">—</span>
        </div>
        <div class="activity-bar-bg">
          <div class="activity-bar-posts" id="activity-bar-posts" style="width:0%"></div>
          <div class="activity-bar-comments" id="activity-bar-comments" style="width:0%"></div>
        </div>
        <div class="activity-legend">
          <div class="legend-item"><div class="legend-dot" style="background:var(--accent3)"></div>自發文</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--accent2)"></div>留言（在他人貼文）</div>
        </div>
      </div>

      <!-- CIB 協同偵測區塊 -->
      <div class="cib-section hidden" id="cib-section">
        <div class="cib-header">
          <span class="cib-label">協同虛假行為偵測</span>
          <span class="cib-badge" id="cib-badge">—</span>
        </div>
        <div class="cib-detail" id="cib-detail"></div>
      </div>

      <div class="score-section">
        <div class="score-ring-wrap">
          <svg class="score-ring" viewBox="0 0 120 120">
            <circle class="score-ring-bg" cx="60" cy="60" r="52"/>
            <circle class="score-ring-fill" id="score-ring-fill" cx="60" cy="60" r="52"
              stroke="#ff3b5c" stroke-dasharray="326.726" stroke-dashoffset="326.726"/>
          </svg>
          <div class="score-number">
            <span class="score-val" id="score-val">0</span>
            <span class="score-max">/ 100</span>
          </div>
        </div>
        <div class="score-verdict">
          <div class="verdict-tag" id="verdict-tag">—</div>
          <div class="verdict-text" id="verdict-text">—</div>
        </div>
      </div>

      <div class="dimensions">
        <div class="section-title">各維度評分明細</div>
        <div class="dim-item">
          <div class="dim-header"><span class="dim-name">社交網絡與協同行為</span><span class="dim-score-text" id="dim-network-score">— / 35</span></div>
          <div class="dim-bar-bg"><div class="dim-bar-fill" id="dim-network-bar" style="background:#ff3b5c"></div></div>
          <div class="dim-note" id="dim-network-note"></div>
        </div>
        <div class="dim-item">
          <div class="dim-header"><span class="dim-name">內容與文本特徵</span><span class="dim-score-text" id="dim-content-score">— / 30</span></div>
          <div class="dim-bar-bg"><div class="dim-bar-fill" id="dim-content-bar" style="background:#ffb800"></div></div>
          <div class="dim-note" id="dim-content-note"></div>
        </div>
        <div class="dim-item">
          <div class="dim-header"><span class="dim-name">活動與時間規律</span><span class="dim-score-text" id="dim-activity-score">— / 20</span></div>
          <div class="dim-bar-bg"><div class="dim-bar-fill" id="dim-activity-bar" style="background:#00b4ff"></div></div>
          <div class="dim-note" id="dim-activity-note"></div>
        </div>
        <div class="dim-item">
          <div class="dim-header"><span class="dim-name">帳號基本資料</span><span class="dim-score-text" id="dim-profile-score">— / 15</span></div>
          <div class="dim-bar-bg"><div class="dim-bar-fill" id="dim-profile-bar" style="background:#00e5a0"></div></div>
          <div class="dim-note" id="dim-profile-note"></div>
        </div>
      </div>

      <div class="analysis-section">
        <div class="analysis-title">分析摘要 <span class="ai-badge">AI</span></div>
        <div class="analysis-text" id="analysis-text">—</div>
      </div>


    </div>
  </div>
</div>

<script>
// ★ 部署後把這裡換成你的 Cloudflare Worker 網址 ★
const WORKER_URL = "https://wangjun-radar.wd89md2wsd.workers.dev";

const $ = id => document.getElementById(id);
function fmtNum(n) {
  if (n==null) return "?";
  if (n>=1e6) return (n/1e6).toFixed(1)+"M";
  if (n>=1e3) return (n/1e3).toFixed(1)+"K";
  return String(n);
}
function scoreColor(s) {
  if (s<=30) return "#00e5a0";
  if (s<=60) return "#ffb800";
  if (s<=80) return "#ff6400";
  return "#ff3b5c";
}
function verdictInfo(s) {
  if (s<=30) return {cls:"verdict-safe",      label:"正常使用者",     text:"該帳號呈現正常使用者的行為模式，無明顯可疑跡象。"};
  if (s<=60) return {cls:"verdict-suspicious", label:"部分可疑",       text:"具備部分機器人或目的性帳號特徵，建議持續觀察。"};
  if (s<=80) return {cls:"verdict-high",       label:"高度可疑",       text:"高度可疑，很可能為網軍工蜂帳號或自動化機器人。"};
  return            {cls:"verdict-confirmed",  label:"幾乎確認為網軍", text:"行為模式嚴重違反自然人使用邏輯，強烈建議封鎖。"};
}

function setStep(n) {
  const el=$("steps");
  if(n===0){el.classList.add("hidden");return;}
  el.classList.remove("hidden");
  [1,2,3,4,5].forEach(i=>{
    const s=$(`step-${i}`);
    s.className="step";
    if(i<n)s.classList.add("done");
    if(i===n)s.classList.add("active");
    if(i<=4)s.querySelector(".step-num").textContent=i<n?"✓":String(i);
  });
}

let timerInterval=null;
const TOTAL_SEC = 90;
function startTimer(){
  clearTimer();
  let sec=0;
  updateProgress(0);
  timerInterval=setInterval(()=>{
    sec++;
    const pct=Math.min(Math.round((sec/TOTAL_SEC)*100), 95);
    updateProgress(pct, TOTAL_SEC - sec);
  },1000);
}
function updateProgress(pct, remaining){
  const fill=$("progress-fill");
  const pctEl=$("progress-pct");
  const timeEl=$("progress-time");
  if(fill) fill.style.width=pct+"%";
  if(pctEl) pctEl.textContent=pct+"%";
  if(timeEl){
    if(remaining==null) timeEl.textContent="預計約 90 秒";
    else if(remaining<=0) timeEl.textContent="即將完成…";
    else timeEl.textContent=`剩餘約 ${remaining} 秒`;
  }
}
function clearTimer(){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  updateProgress(100, 0);
}
function setLoading(title,sub){
  if(!title){$("loading-box").classList.add("hidden");clearTimer();return;}
  $("loading-box").classList.remove("hidden");
  $("loading-title").textContent=title;
  $("loading-sub").textContent=sub||"";
  startTimer();
}
function setError(msg){
  const el=$("error-box");
  if(!msg){el.classList.add("hidden");return;}
  el.classList.remove("hidden");
  el.textContent="⚠ "+msg;
}
function setScanning(on){
  $("scan-btn").disabled=on;
  $("username-input").disabled=on;
  $("scan-btn").textContent=on?"分析中…":"開始偵防";
}

function renderResult(data){
  const {profile,ownPostsCount,commentsCount,analysis}=data;
  const total=ownPostsCount+commentsCount;
  const postPct=total>0?Math.round((ownPostsCount/total)*100):50;
  const commentPct=100-postPct;

  if(profile.profilePicUrl){
    $("avatar-wrap").innerHTML=`<img src="${profile.profilePicUrl}" alt="" onerror="this.parentNode.textContent='👤'"/>`;
  } else { $("avatar-wrap").textContent="👤"; }
  $("profile-name").textContent=profile.fullName||profile.username||"—";
  $("profile-handle").textContent="@"+(profile.username||"—")+(profile.isVerified?" ✓":"");
  if (profile.location) {
    const locEl = $("profile-location");
    locEl.classList.remove("hidden");
    // 判斷是否境外（非台灣地區）
    const twKeywords = ["台灣","台北","台中","台南","高雄","新北","桃園","新竹","台東","花蓮","基隆","嘉義","苗栗","彰化","南投","雲林","屏東","宜蘭","澎湖","金門","連江"];
    const isTW = twKeywords.some(k => profile.location.includes(k));
    if (isTW) {
      locEl.textContent = "📍 " + profile.location;
    } else {
      locEl.textContent = "⚠️ 境外帳號：" + profile.location;
      locEl.classList.add("foreign");
    }
  }
  
  const fc=profile.followerCount;
  $("stat-followers").textContent=(fc!=null)?fmtNum(fc):"—";
  $("stat-own-posts").textContent=String(ownPostsCount);
  $("stat-own-posts-label").textContent=`自發文 參考${ownPostsCount}篇`;
  $("stat-comments").textContent=String(commentsCount);
  $("stat-comments-label").textContent=`留言 參考${commentsCount}則`;

  $("activity-ratio-text").textContent=`自發文 ${postPct}% ／ 留言 ${commentPct}%`;
  requestAnimationFrame(()=>setTimeout(()=>{
    $("activity-bar-posts").style.width=postPct+"%";
    $("activity-bar-comments").style.width=commentPct+"%";
  },100));

  const score=analysis.totalScore||0;
  const circ=326.726;
  const fill=$("score-ring-fill");
  fill.setAttribute("stroke",scoreColor(score));
  fill.setAttribute("stroke-dashoffset",circ);
  $("score-val").textContent=score;
  $("score-val").style.color=scoreColor(score);
  requestAnimationFrame(()=>setTimeout(()=>fill.setAttribute("stroke-dashoffset",circ-(score/100)*circ),80));

  const v=verdictInfo(score);
  $("verdict-tag").className="verdict-tag "+v.cls;
  $("verdict-tag").textContent=v.label;
  $("verdict-text").textContent=v.text;

  [{key:"network",sId:"dim-network-score",bId:"dim-network-bar",nId:"dim-network-note",max:35},
   {key:"content",sId:"dim-content-score",bId:"dim-content-bar",nId:"dim-content-note",max:30},
   {key:"activity",sId:"dim-activity-score",bId:"dim-activity-bar",nId:"dim-activity-note",max:20},
   {key:"profile",sId:"dim-profile-score",bId:"dim-profile-bar",nId:"dim-profile-note",max:15}
  ].forEach(d=>{
    const dim=analysis.dimensions?.[d.key];if(!dim)return;
    $(d.sId).textContent=`${dim.score} / ${d.max}`;
    $(d.nId).textContent=dim.note||"";
    requestAnimationFrame(()=>setTimeout(()=>$(d.bId).style.width=`${(dim.score/d.max)*100}%`,200));
  });

  // CIB 區塊
  const cibSection = $("cib-section");
  const cibScore = data.cibScore || 0;
  const cibDetails = data.cibDetails || [];
  if (cibScore > 0 || cibDetails.length > 0) {
    cibSection.classList.remove("hidden");
    const badge = $("cib-badge");
    if (cibScore >= 15) { badge.textContent = "高度可疑協同"; badge.className = "cib-badge cib-high"; }
    else if (cibScore >= 5) { badge.textContent = "部分協同跡象"; badge.className = "cib-badge cib-low"; }
    else { badge.textContent = "無明顯協同"; badge.className = "cib-badge cib-none"; }
    if (cibDetails.length > 0) {
      $("cib-detail").innerHTML = cibDetails.map(d =>
        `關鍵字「${d.keyword}」48 小時內有 <strong>${d.similarAccountCount}</strong> 個帳號發布類似內容`
      ).join("<br>");
    } else {
      $("cib-detail").textContent = "未發現明顯的跨帳號協同發文跡象";
    }
  }
  $("analysis-text").textContent=analysis.analysis||"—";
  $("result-card").classList.remove("hidden");
}

// 步驟文字自動推進（配合 Worker 實際處理時間）
const stepMessages=[
  {step:1,title:"正在抓取帳號資料…",   sub:"取得基本資訊、粉絲數、頭像",           delay:0},
  {step:2,title:"正在抓取自發文…",     sub:"分析原創貼文內容與互動數據",             delay:18000},
  {step:3,title:"正在追蹤留言蹤跡…",   sub:"搜尋在他人貼文的留言行為（補充網軍偵測）",delay:38000},
  {step:4,title:"AI 正在分析中…",      sub:"綜合自發文與留言資料，對照四大維度評分",  delay:58000},
];
let stepTimers=[];
function startStepAnimation(){
  stepTimers.forEach(clearTimeout);
  stepTimers=stepMessages.map(({step,title,sub,delay})=>
    setTimeout(()=>{setStep(step);$("loading-title").textContent=title;$("loading-sub").textContent=sub;},delay)
  );
}
function clearStepAnimation(){stepTimers.forEach(clearTimeout);stepTimers=[];}

async function handleScan(){
  const raw=$("username-input").value.trim();
  if(!raw){setError("請輸入帳號名稱");return;}
  setError(null);
  $("result-card").classList.add("hidden");
  setScanning(true);
  startStepAnimation();
  setLoading("正在抓取帳號資料…","取得基本資訊、粉絲數、頭像");

  try {
    const res=await fetch(WORKER_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username:raw}),
    });
    const data=await res.json();
    if(!res.ok||data.error) throw new Error(data.error||"伺服器錯誤");
    clearStepAnimation();
    setStep(5);
    setLoading(null);
    renderResult(data);
  } catch(e){
    clearStepAnimation();
    setStep(0);
    setLoading(null);
    setError(e.message||"連線失敗，請稍後再試");
  } finally {
    setScanning(false);
    clearTimer();
  }
}

$("scan-btn").addEventListener("click",handleScan);
$("username-input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!$("scan-btn").disabled)handleScan();});

</script>
